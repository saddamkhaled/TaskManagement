apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanagement-deployment
  namespace: devopsproject
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmanagement
  template:
    metadata:
      labels:
        app: taskmanagement
    spec: 
      containers:
      - name: taskmanagement
        image: elboff/taskmanagement:latest
        ports:
        - containerPort: 80
